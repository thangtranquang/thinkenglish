<style>
  :root{--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eff6ff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--ok:#059669;--warn:#d97706;--bad:#e11d48}

  .av{font-size:30px;width:56px;height:56px;border:2px solid var(--line);border-radius:50%;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .av.on{border-color:var(--blue);background:var(--blue-l)}
  .err{color:var(--bad);font-size:12px;font-weight:600}
  .sw{position:relative;width:48px;height:28px;flex-shrink:0}.sw input{appearance:none;width:48px;height:28px;border-radius:99px;background:#cbd5e1;cursor:pointer;transition:.2s;outline-offset:2px}.sw input:checked{background:var(--blue)}.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked::after{left:23px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:64px}.bars i{flex:1;background:var(--blue);border-radius:6px 6px 0 0;min-height:4px;opacity:.85}
  :focus-visible{outline:3px solid #93c5fd;outline-offset:2px}

<script>

const $ = (id)=>document.getElementById(id);
function el(tag, props={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v;
    else if(k==='checked') e.checked=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
  return e;
}
const U=(id)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=800&q=80`;
const L=(word,ipa,vi,ok,x,y)=>({word,ipa,vi,ok:[word,...ok],x,y});
const D=(en,vi)=>({en,vi});

/* ---------- Dữ liệu mẫu (thật: đọc từ DB, 0 lần gọi AI) ---------- */
const CARDS=[

  desc:[D('A man is sitting at a sidewalk cafe, drinking coffee.','Một người đàn ông ngồi ở quán cà phê vỉa hè, uống cà phê.'),D('Motorcycles are parked on the street.','Nhiều xe máy đỗ trên đường.')],
  story:D('This is a busy morning in Vietnam. People grab breakfast before work and enjoy hot coffee on the pavement.','Một buổi sáng bận rộn ở Việt Nam. Mọi người ăn sáng trước giờ làm và uống cà phê nóng ngoài vỉa hè.')},
 {id:'c2',title:'Góc làm việc tại nhà',topic:'Bàn làm việc',icon:'💻',img:U('photo-1518455027359-f3f8164ba6bd'),mem:92,mine:true,vis:'private',
  labels:[L('laptop','/ˈlæp.tɒp/','máy tính xách tay',['computer'],.4,.55),L('mouse','/maʊs/','chuột máy tính',[],.62,.68),L('monitor','/ˈmɒn.ɪ.tər/','màn hình',['screen'],.5,.3)],
  desc:[D('A laptop is open on the desk.','Một máy tính xách tay đang mở trên bàn.'),D('The mouse is next to the keyboard.','Con chuột nằm cạnh bàn phím.')],
  story:D('This is my study corner. I do my homework here every evening.','Đây là góc học tập của tôi. Tối nào tôi cũng làm bài tập ở đây.')},
 {id:'c3',title:'Bữa cơm tối gia đình',topic:'Nhà bếp',icon:'🍳',img:U('photo-1547496502-affa22d38842'),mem:65,mine:true,vis:'private',
  labels:[L('bowl','/boʊl/','cái bát',[],.35,.6),L('chopsticks','/ˈtʃɒp.stɪks/','đôi đũa',['chopstick'],.6,.45),L('plate','/pleɪt/','cái đĩa',['dish'],.5,.75)],
  desc:[D('There is a bowl of soup on the table.','Có một bát canh trên bàn.'),D('We eat dinner together.','Chúng tôi ăn tối cùng nhau.')],
  story:D('Dinner is the best time of the day. My family sits together and talks.','Bữa tối là lúc vui nhất trong ngày. Cả nhà ngồi bên nhau và trò chuyện.')},
 {id:'c4',title:'Bãi giữ xe máy',topic:'Đường phố',icon:'🛵',img:U('photo-1558981806-ec527fa84c39'),mem:30,mine:true,vis:'private',
  labels:[L('helmet','/ˈhel.mɪt/','mũ bảo hiểm',[],.3,.5),L('key','/kiː/','chìa khóa',[],.65,.62),L('parking lot','/ˈpɑː.kɪŋ lɒt/','bãi đỗ xe',['parking'],.5,.35)],
  desc:[D('Many motorbikes are in the parking lot.','Nhiều xe máy đang ở trong bãi đỗ.'),D('He puts on his helmet.','Cậu ấy đội mũ bảo hiểm.')],
  story:D('After school, I take my bike from the parking lot. I always wear my helmet.','Tan học, tôi lấy xe ở bãi giữ xe. Tôi luôn đội mũ bảo hiểm.')},
 {id:'e1',title:'Ly cà phê buổi sáng',topic:'Cà phê',icon:'☕',img:U('photo-1495474472287-4d71bcdd2085'),mem:0,mine:false,saved:false,by:'Hệ thống',

  desc:[D('A cup of coffee is on the table.','Một tách cà phê ở trên bàn.'),D('The spoon is on the saucer.','Cái thìa nằm trên đĩa lót.')],story:D('I drink coffee every morning. It helps me wake up.','Sáng nào tôi cũng uống cà phê. Nó giúp tôi tỉnh táo.')},
 {id:'e2',title:'Quán ăn đông khách',topic:'Nhà bếp',icon:'🍜',img:U('photo-1555396273-367ea4eb4db5'),mem:0,mine:false,saved:false,by:'Hệ thống',
  labels:[L('table','/ˈteɪ.bəl/','cái bàn',[],.5,.7),L('chair','/tʃer/','cái ghế',[],.25,.6),L('menu','/ˈmen.juː/','thực đơn',[],.7,.5)],
  desc:[D('People are eating at the tables.','Mọi người đang ăn ở các bàn.'),D('A waiter is holding a menu.','Một nhân viên đang cầm thực đơn.')],story:D('The restaurant is full tonight. Everyone looks happy.','Nhà hàng tối nay rất đông. Ai cũng vui vẻ.')},
 {id:'e3',title:'Bàn học gọn gàng',topic:'Bàn làm việc',icon:'📚',img:U('photo-1519389950473-47ba0277781c'),mem:0,mine:false,saved:false,by:'Hệ thống',
  labels:[L('notebook','/ˈnoʊt.bʊk/','quyển vở',['book'],.4,.6),L('pen','/pen/','cái bút',['pencil'],.6,.65),L('lamp','/læmp/','đèn bàn',['light'],.75,.3)],
  desc:[D('A notebook is open on the desk.','Một quyển vở mở trên bàn.'),D('The lamp is turned on.','Đèn bàn đang bật.')],story:D('I study at night. A good desk makes me focus.','Tôi học vào buổi tối. Bàn học gọn giúp tôi tập trung.')},

const TOPICS=['Tất cả','Cà phê','Đường phố','Nhà bếp','Bàn làm việc'];
CARDS.forEach(c=>{c.prog={1:0,2:0,3:0}; if(c.mine&&c.mem>=60){c.prog={1:80,2:75,3:0}}});

/* ---------- Trạng thái ---------- */
const S={user:null,route:{name:'welcome',p:{}},libTab:'mine',libTopic:'Tất cả',libQ:'',expTopic:'Tất cả',expQ:'',
  hideTimer:false,streak:3,doneToday:1,goal:3,week:[5.2,4.6,4.1,3.8,3.9,3.2,0],aiCalls:0,draft:null,
  mic:null,vad:0,rec:null,timeouts:[],raf:0,hasMic:false};
const FRAME=$('screen'),NAV=$('nav');
const R={};
function go(name,p={}){ cleanup(); S.route={name,p}; render(); }
function render(){
  const r=R[S.route.name](S.route.p);
  FRAME.replaceChildren(...[r.header,r.body].filter(Boolean));
  if(r.nav){ NAV.classList.remove('hidden'); drawNav(r.nav); } else NAV.classList.add('hidden');
}
function cleanup(){ RX.tok++; AP.tok++; S.timeouts.forEach(clearTimeout); S.timeouts=[]; cancelAnimationFrame(S.raf); stopListening(); try{speechSynthesis.cancel();}catch(e){} if(curAudio) curAudio.pause(); }
function later(fn,ms){ const id=setTimeout(fn,ms); S.timeouts.push(id); return id; }
function toast(t){ const o=el('div',{class:'toast',role:'status'},t); document.querySelector('.app').append(o); setTimeout(()=>o.remove(),2200); }
/* ---------- Âm thanh mẫu: giọng nam trẻ neural của Microsoft (en-US-BrianNeural, cao độ +20Hz) ----------
   File mp3 được sinh sẵn bằng tools/gen_audio.py (thật: sinh 1 lần lúc xử lý ảnh, lưu audio_assets).
   Tên file = slug + djb2(text), khớp với tools/gen_audio.py. Không có file thì dùng giọng trình duyệt. */
function audioName(t){ let h=5381; for(let i=0;i<t.length;i++) h=(Math.imul(h,33)+t.charCodeAt(i))>>>0;
  return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)+'-'+h.toString(16)+'.mp3'; }
let curAudio=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); const f=/brian|andrew|guy|ryan|eric|christopher|roger|mark|david|daniel|alex|male/i;
  return vs.find(v=>/microsoft/i.test(v.name)&&/natural|online/i.test(v.name)&&f.test(v.name))||vs.find(v=>f.test(v.name))||vs.find(v=>v.lang==='en-US')||null; }catch(e){ return null; } }
function speakFallback(t,done){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.9; const v=pickVoice(); if(v) u.voice=v; u.onend=u.onerror=()=>done&&done(); speechSynthesis.speak(u);}catch(e){ done&&done(); } }
/* speak() trả về Promise, resolve khi đọc xong (hoặc bị ngắt/lỗi) để chế độ tự động nối bước tiếp theo */
function speak(t){
  return new Promise(res=>{
    try{ speechSynthesis.cancel(); }catch(e){}

function scene(card,{markers=true,only=null,region=null,onMarker=null,drag=false,labels=true,src=null,onMove=null}={}){
  const img=el('img',{src:src||card.img,alt:'Ảnh '+card.title});
  const s=el('div',{class:'scene'},img,el('span',{class:'cap'},card.title));
  img.addEventListener('load',()=>{ s.style.aspectRatio=img.naturalWidth+'/'+img.naturalHeight; });
  img.addEventListener('error',()=>img.remove());
  if(markers) card.labels.forEach((lb,i)=>{
    if(only!=null && only!==i) return;
    const m=el('button',{class:'mk'+(drag?' drag':'')+(region?' region':''),style:`left:${lb.x*100}%;top:${lb.y*100}%`,'aria-label':drag?`Kéo để chỉnh vị trí ${lb.word}`:lb.word},el('i'),(labels&&!region)?el('span',{class:'lb'},lb.word):null);
    if(onMarker) m.addEventListener('click',()=>onMarker(lb,i));
    if(drag){
      m.addEventListener('pointerdown',(e)=>{ m.setPointerCapture(e.pointerId); m.dataset.d='1'; });
      m.addEventListener('pointermove',(e)=>{ if(!m.dataset.d) return; const r=s.getBoundingClientRect();
        lb.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); lb.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
        m.style.left=lb.x*100+'%'; m.style.top=lb.y*100+'%'; if(onMove) onMove(); });
      m.addEventListener('pointerup',()=>{ delete m.dataset.d; });
      m.addEventListener('pointercancel',()=>{ delete m.dataset.d; });
    }
    s.append(m);
  });
  return s;
}

    el('div',{class:'card'},el('span',{class:'badge '+lab[1],style:'align-self:flex-start'},lab[0]),el('div',{class:it.type==='word'?'word':'',style:it.type==='word'?'':'font-size:17px;font-weight:700'},it.text),it.ipa?el('div',{class:'ipa'},it.ipa):null,vi,
      el('div',{class:'row'},el('button',{class:'btn sec sm',onclick:()=>speak(it.text)},'🔊 Nghe mẫu'),el('button',{class:'btn sec sm',onclick:(e)=>{vi.classList.toggle('hidden');e.currentTarget.textContent=vi.classList.contains('hidden')?'Xem nghĩa':'Ẩn nghĩa';}},'Xem nghĩa'))),
    el('div',{class:'stat two'},el('div',{},el('b',{},r.ms==null?'—':(r.ms/1000).toFixed(1)+'s'),el('span',{},'Thời gian bắt đầu nói')),el('div',{},el('b',{},r.score==null?'—':String(r.score)),el('span',{},r.unverified?'Điểm tốc độ (chưa kiểm tra nội dung)':'Điểm phản xạ'))),
    RX.auto?el('p',{class:'note'},last?'Sắp hiện tổng kết…':'Tự động chuyển sang vòng tiếp theo…'):null,
    el('button',{class:RX.auto?'btn sec':'btn',onclick:()=>{ if(last) go('reflexSummary'); else {RX.i++; go('reflexRound');} }},last?'Xem tổng kết':'Vòng tiếp theo'))};
};
R.reflexSummary=()=>{
  const timed=RX.results.filter(r=>r.ms!=null); const avgMs=timed.length?Math.round(timed.reduce((a,r)=>a+r.ms,0)/timed.length):null;
  const scored=RX.results.filter(r=>r.score!=null); const skipped=RX.results.length-scored.length;
  const avg=scored.length?Math.round(scored.reduce((a,r)=>a+r.score,0)/scored.length):null; const weak=RX.results.filter(r=>r.verdict!=='good'&&r.verdict!=='skip');
  /* cập nhật độ nhớ của thẻ + streak (mô phỏng ghi attempts/review_state) */
  const by=new Map(); scored.forEach(r=>{ const a=by.get(r.item.card)||[]; a.push(r.score); by.set(r.item.card,a); });
  by.forEach((a,c)=>{ const m=a.reduce((x,y)=>x+y,0)/a.length; c.mem=Math.round(c.mem*.5+m*.5); });
  if(RX.source==='daily'){ S.doneToday=Math.min(S.goal,S.doneToday+1); }
  if(avgMs!=null){ const idx=S.week.indexOf(0); if(idx>0) S.week[idx-1]=+(avgMs/1000).toFixed(1); }
  return {header:hdr('Tổng kết phiên'),body:el('div',{class:'body'},
    el('div',{class:'stat two'},el('div',{},el('b',{},avgMs==null?'—':(avgMs/1000).toFixed(1)+'s'),el('span',{},'Phản hồi trung bình')),el('div',{},el('b',{},avg==null?'—':String(avg)),el('span',{},'Điểm phản xạ'))),
    skipped?el('p',{class:'note'},skipped+' vòng không chấm điểm vì không có micro.'):null,
    weak.length?el('div',{class:'card'},el('h2',{},'Sẽ đưa vào lịch ôn tập'),...weak.map(r=>el('div',{class:'row'},el('span',{},r.item.text),el('span',{class:'sub'},r.verdict==='slow'?'cần nhanh hơn':'cần ôn lại')))):(scored.length?el('div',{class:'card'},el('h2',{},'Tuyệt vời! Cả phiên đều phản xạ tốt.')):el('div',{class:'card'},el('h2',{},'Phiên nghe và nói theo'),el('p',{class:'sub'},'Chưa có điểm vì máy không có micro. Cho phép micro để được chấm tự động.'))),
    el('p',{class:'note'},'Bản thật: ghi vào bảng attempts và review_state (SM-2) cho từng từ.'),
    el('button',{class:'btn',onclick:()=>go('home')},'Về Trang chủ'),el('button',{class:'btn sec',onclick:()=>go('library')},'Xem Thư viện'))};
};

/* =====================================================================
   8. LIBRARY
   ===================================================================== */
R.library=()=>{
  const mine=CARDS.filter(c=>c.mine), saved=mine.filter(c=>c.src), need=mine.filter(c=>c.mem<60);
  const tabs=el('div',{class:'seg',role:'tablist'},...[['mine','Bài của tôi',mine.length],['saved','Đã lưu',saved.length],['due','Cần ôn lại',need.length]].map(([k,t,n])=>el('button',{class:k===S.libTab?'on':'',role:'tab','aria-selected':k===S.libTab?'true':'false',onclick:()=>{S.libTab=k;go('library');}},el('b',{},t),el('small',{},n+' bài'))));
  const q=el('input',{type:'text',placeholder:'Tìm theo đồ vật: coffee, helmet, desk...','aria-label':'Tìm theo từ vựng',value:S.libQ});
  const chips=el('div',{class:'chips'}); const grid=el('div',{class:'grid2'});
  const draw=()=>{ chips.replaceChildren(...TOPICS.map(t=>el('button',{class:'chip'+(t===S.libTopic?' on':''),onclick:()=>{S.libTopic=t;draw();}},t)));
    const k=S.libQ.trim().toLowerCase(); const base=S.libTab==='mine'?mine:S.libTab==='saved'?saved:need;
    const items=base.filter(c=>(S.libTopic==='Tất cả'||c.topic===S.libTopic)&&(!k||c.labels.some(l=>l.word.includes(k))||c.title.toLowerCase().includes(k)));
    grid.replaceChildren(...(items.length?items.map(c=>tile(c,{onclick:()=>go('practice',{id:c.id})})):[el('p',{class:'sub',style:'grid-column:1/3;text-align:center;padding:20px'},S.libTab==='saved'?'Chưa lưu thẻ nào từ Khám phá.':'Không có bài nào.')])); };
  q.addEventListener('input',()=>{S.libQ=q.value;draw();}); draw();
  return {nav:'library',header:hdr('Thư viện',{right:el('button',{class:'btn sm',onclick:()=>go('reflexStart',{items:need.length?need.flatMap(c=>c.labels.map(l=>({card:c,label:l,type:'word'}))).slice(0,6):dueItems(6),source:'card'})},'⚡ Ôn nhanh')}),
    body:el('div',{class:'body'},tabs,q,chips,grid)};
};

    el('div',{class:'stat'},el('div',{},el('b',{},String(mine.length)),el('span',{},'Bài của tôi')),el('div',{},el('b',{},avg+'%'),el('span',{},'Độ nhớ TB')),el('div',{},el('b',{},'🔥 '+S.streak),el('span',{},'Streak'))),

      el('div',{class:'row'},el('span',{},'Nhắc nghỉ sau'),el('b',{},'20 phút/ngày'))),
    el('div',{class:'card'},el('h3',{},'Riêng tư & phụ huynh'),
      el('div',{class:'row'},el('span',{},'Ảnh mặc định'),el('span',{class:'badge good'},'Riêng tư')),
      el('div',{class:'row'},el('span',{},'Vị trí/EXIF trong ảnh'),el('span',{class:'badge good'},'Đã xóa')),
      el('div',{class:'row'},el('span',{},'Phụ huynh đồng ý'),el('span',{class:'badge '+(u.consent?'good':'info')},u.consent?'Đã xác nhận':'Không cần')),
